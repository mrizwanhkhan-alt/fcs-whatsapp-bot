
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FCS Express Staff Calling</title>

<style>
* { box-sizing: border-box; }

body {
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  margin: 0;
  padding: 20px;
}

.panel {
  max-width: 440px;
  margin: 30px auto;
  background: white;
  padding: 25px;
  border-radius: 12px;
}

h2 {
  color: #c8102e;
  margin-bottom: 5px;
}

h3 { margin-top: 5px; }

label {
  display: block;
  margin-top: 16px;
  font-weight: bold;
}

input, button {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  font-size: 16px;
  border-radius: 7px;
}

input {
  border: 1px solid #ccc;
}

button {
  border: none;
  background: #c8102e;
  color: white;
  cursor: pointer;
}

button:disabled {
  background: #aaa;
  cursor: not-allowed;
}

#status {
  color: #444;
  line-height: 1.6;
  white-space: pre-wrap;
}

.note {
  color: #777;
  font-size: 13px;
}

</style>
</head>

<body>

<div class="panel">

<h2>FCS EXPRESS</h2>
<h3>WhatsApp Staff Calling</h3>

<label>Customer WhatsApp Number</label>
<input
  id="customer"
  type="tel"
  inputmode="numeric"
  placeholder="923001234567"
>

<label>Staff Calling Secret</label>
<input
  id="secret"
  type="password"
  autocomplete="off"
  placeholder="Enter staff access secret"
>

<button id="permission">
  Request Calling Permission
</button>

<button id="call" disabled>
  Call Customer
</button>

<button id="end" disabled>
  End Call
</button>

<p id="status">Ready to check microphone.</p>

<p class="note">
  Calling requires customer permission and
  a working Meta WebRTC connection.
</p>

</div>

<script>
"use strict";

const customer = document.getElementById("customer");
const secret = document.getElementById("secret");
const permission = document.getElementById("permission");
const callButton = document.getElementById("call");
const endButton = document.getElementById("end");
const statusBox = document.getElementById("status");

let peer = null;
let localStream = null;
let permissionRequestedFor = "";

function setStatus(message) {
  statusBox.textContent = message;
}

function getNumber() {
  const number = customer.value
    .trim()
    .replace(/^\+/, "");

  if (!/^\d{8,15}$/.test(number)) {
    throw new Error(
      "Enter a valid international WhatsApp number."
    );
  }

  return number;
}

function getSecret() {
  const value = secret.value.trim();

  if (!value) {
    throw new Error(
      "Enter the configured Staff Calling Secret."
    );
  }

  return value;
}

async function api(endpoint, data) {
  const response = await fetch(
    "/api/staff-calling/" + endpoint,
    {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + getSecret()
      },
      body: JSON.stringify(data),
      cache: "no-store"
    }
  );

  const result = await response.json();

  if (!response.ok) {
    throw new Error(
      result.error || "Calling API request failed."
    );
  }

  return result;
}

async function cleanup() {
  if (peer) {
    peer.close();
    peer = null;
  }

  if (localStream) {
    localStream.getTracks().forEach(
      track => track.stop()
    );
    localStream = null;
  }

  endButton.disabled = true;
}

permission.onclick = async function () {
  permission.disabled = true;

  try {
    const number = getNumber();

    setStatus("Sending calling permission request...");

    await api("permission", {
      number: number
    });

    permissionRequestedFor = number;

    setStatus(
      "Calling permission request submitted.\n" +
      "Customer approval must be confirmed " +
      "before calling."
    );

    // A submitted request is not proof of approval.
    callButton.disabled = true;

  } catch (error) {
    setStatus("Error: " + error.message);
  } finally {
    permission.disabled = false;
  }
};

callButton.onclick = async function () {
  callButton.disabled = true;

  try {
    const number = getNumber();

    if (number !== permissionRequestedFor) {
      throw new Error(
        "Request calling permission for this number first."
      );
    }

    setStatus("Preparing microphone...");

    localStream =
      await navigator.mediaDevices.getUserMedia({
        audio: true,
        video: false
      });

    peer = new RTCPeerConnection();

    localStream.getTracks().forEach(track => {
      peer.addTrack(track, localStream);
    });

    const offer = await peer.createOffer();

    await peer.setLocalDescription(offer);

    // Wait for local ICE gathering.
    if (peer.iceGatheringState !== "complete") {
      await new Promise((resolve, reject) => {
        const timeout = setTimeout(() => {
          reject(new Error("ICE gathering timed out"));
        }, 15000);

        function check() {
          if (peer.iceGatheringState === "complete") {
            clearTimeout(timeout);
            peer.removeEventListener(
              "icegatheringstatechange",
              check
            );
            resolve();
          }
        }

        peer.addEventListener(
          "icegatheringstatechange",
          check
        );

        check();
      });
    }

    setStatus("Sending WhatsApp call request...");

    const result = await api("connect", {
      number: number,
      sdp: peer.localDescription.sdp
    });

    const answer =
      result.result?.session?.sdp ||
      result.result?.session?.sdp_answer ||
      result.result?.sdp;

    if (!answer) {
      throw new Error(
        "Meta did not return a usable SDP answer. " +
        "Calling integration needs completion."
      );
    }

    await peer.setRemoteDescription({
      type: "answer",
      sdp: answer
    });

    endButton.disabled = false;

    setStatus(
      "Call signaling completed. " +
      "Waiting for audio connection..."
    );

    peer.onconnectionstatechange = function () {
      if (!peer) return;

      setStatus(
        "WebRTC connection: " +
        peer.connectionState
      );
    };

  } catch (error) {
    setStatus("Call error: " + error.message);
    await cleanup();
  }
};

endButton.onclick = async function () {
  await cleanup();

  setStatus(
    "Local microphone and WebRTC connection closed. " +
    "Remote call termination is not yet implemented."
  );
};

customer.oninput = function () {
  permissionRequestedFor = "";
  callButton.disabled = true;
};

async function checkMicrophone() {
  try {
    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {
      setStatus(
        "Microphone is unavailable in this browser."
      );
      return;
    }

    setStatus(
      "Panel ready. Request calling permission first."
    );

  } catch (error) {
    setStatus(error.message);
  }
}

checkMicrophone();

</script>

</body>
</html>
