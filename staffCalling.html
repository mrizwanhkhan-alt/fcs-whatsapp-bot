
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FCS Express | Staff Calling</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;background:#f4f5f7;font-family:Arial,sans-serif}
.panel{max-width:460px;margin:25px auto;padding:24px;background:white;border-radius:12px;box-shadow:0 3px 18px #00000012}
h2{color:#c8102e;margin-bottom:4px}
h3{margin-top:0;color:#333}
label{display:block;margin-top:16px;font-weight:bold}
input,button{width:100%;padding:13px;margin-top:9px;font-size:16px;border-radius:7px}
input{border:1px solid #ccc}
button{background:#c8102e;color:white;border:0;cursor:pointer}
button:disabled{background:#aaa;cursor:not-allowed}
#end{background:#333}
#end:disabled{background:#aaa}
#status{white-space:pre-wrap;line-height:1.5;padding:12px;background:#f5f5f5;border-radius:7px;overflow-wrap:anywhere}
small{color:#666}
</style>
</head>
<body>

<div class="panel">
<h2>FCS EXPRESS</h2>
<h3>WhatsApp Staff Calling</h3>

<label>Customer WhatsApp Number</label>
<input id="customer" type="tel" placeholder="923001234567">

<label>Staff Access Secret</label>
<input id="secret" type="password" autocomplete="off" placeholder="Staff Calling Secret">

<button id="permission">Request Calling Permission</button>
<button id="call">Call Customer</button>
<button id="end" disabled>End Call</button>

<p id="status">Ready.</p>
<small>Customer calling permission and Meta Calling API access are required.</small>

<audio id="remoteAudio" autoplay playsinline></audio>
</div>

<script>
"use strict";

const $ = id => document.getElementById(id);

const customer = $("customer");
const secret = $("secret");
const permissionButton = $("permission");
const callButton = $("call");
const endButton = $("end");
const remoteAudio = $("remoteAudio");

let peer = null;
let localStream = null;
let activeCallId = null;
let busy = false;

function status(message) {
  $("status").textContent = message;
}

function number() {
  const value = customer.value.trim().replace(/^\+/, "");

  if (!/^\d{8,15}$/.test(value)) {
    throw new Error("Enter a valid international WhatsApp number.");
  }

  return value;
}

async function api(endpoint, payload) {
  const token = secret.value.trim();

  if (!token) {
    throw new Error("Staff Access Secret is required.");
  }

  const response = await fetch("/api/staff-calling/" + endpoint, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + token
    },
    body: JSON.stringify(payload),
    cache: "no-store"
  });

  let data;

  try {
    data = await response.json();
  } catch {
    throw new Error("Invalid server response.");
  }

  if (!response.ok || data.success === false) {
    throw new Error(data.error || "Calling API request failed.");
  }

  return data;
}

function controls() {
  permissionButton.disabled = busy || !!activeCallId;
  callButton.disabled = busy || !!activeCallId;
  endButton.disabled = busy || !activeCallId;
}

async function cleanup() {
  if (peer) {
    peer.close();
    peer = null;
  }

  if (localStream) {
    localStream.getTracks().forEach(track => track.stop());
    localStream = null;
  }

  remoteAudio.srcObject = null;
  activeCallId = null;
  controls();
}

function extractAnswer(data) {
  const result = data.result || {};

  const candidates = [
    result.session,
    result.calls?.[0]?.session,
    result.call?.session,
    result
  ];

  for (const item of candidates) {
    if (
      item &&
      typeof item.sdp === "string" &&
      item.sdp.startsWith("v=0") &&
      item.sdp_type === "answer"
    ) {
      return item.sdp;
    }
  }

  return null;
}

permissionButton.onclick = async () => {
  if (busy) return;

  busy = true;
  controls();

  try {
    status("Requesting customer calling permission...");

    await api("permission", {
      number: number()
    });

    status(
      "Calling permission request submitted.\n" +
      "Wait for the customer to approve it before calling."
    );
  } catch (error) {
    status("Error: " + error.message);
  } finally {
    busy = false;
    controls();
  }
};

callButton.onclick = async () => {
  if (busy || activeCallId) return;

  busy = true;
  controls();

  try {
    const destination = number();

    status("Requesting microphone access...");

    if (!navigator.mediaDevices?.getUserMedia) {
      throw new Error("Browser microphone access unavailable.");
    }

    localStream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: true
      },
      video: false
    });

    peer = new RTCPeerConnection({
      iceServers: []
    });

    localStream.getAudioTracks().forEach(track => {
      peer.addTrack(track, localStream);
    });

    peer.ontrack = event => {
      if (event.streams && event.streams[0]) {
        remoteAudio.srcObject = event.streams[0];
        remoteAudio.play().catch(() => {});
      }
    };

    peer.onconnectionstatechange = () => {
      if (!peer) return;

      if (peer.connectionState === "connected") {
        status("Audio connection established.");
      }

      if (peer.connectionState === "failed") {
        status("Audio connection failed.");
      }

      if (peer.connectionState === "disconnected") {
        status("Audio connection disconnected.");
      }
    };

    status("Preparing WebRTC audio offer...");

    const offer = await peer.createOffer({
      offerToReceiveAudio: true
    });

    await peer.setLocalDescription(offer);

    await new Promise((resolve, reject) => {
      if (peer.iceGatheringState === "complete") {
        resolve();
        return;
      }

      const timeout = setTimeout(() => {
        peer.removeEventListener("icegatheringstatechange", check);
        reject(new Error("ICE gathering timed out."));
      }, 12000);

      function check() {
        if (peer.iceGatheringState === "complete") {
          clearTimeout(timeout);
          peer.removeEventListener("icegatheringstatechange", check);
          resolve();
        }
      }

      peer.addEventListener("icegatheringstatechange", check);
    });

    const sdp = peer.localDescription?.sdp;

    if (!sdp) {
      throw new Error("WebRTC SDP offer unavailable.");
    }

    status("Sending calling request to Meta...");

    const data = await api("connect", {
      number: destination,
      sdp
    });

    activeCallId =
      data.callId ||
      data.result?.calls?.[0]?.id ||
      null;

    const answer = extractAnswer(data);

    if (!answer) {
      throw new Error(
        "Meta did not return a usable SDP answer. " +
        "Audio connection cannot be established."
      );
    }

    await peer.setRemoteDescription({
      type: "answer",
      sdp: answer
    });

    if (!activeCallId) {
      throw new Error(
        "Meta call ID missing. Call termination unavailable."
      );
    }

    status("Calling connection requested. Waiting for audio...");

  } catch (error) {
    const callId = activeCallId;

    if (callId) {
      try {
        await api("terminate", { callId });
      } catch {}
    }

    await cleanup();
    status("Call failed: " + error.message);
  } finally {
    busy = false;
    controls();
  }
};

endButton.onclick = async () => {
  if (busy || !activeCallId) return;

  busy = true;
  controls();

  const callId = activeCallId;

  try {
    status("Ending WhatsApp call...");

    await api("terminate", {
      callId
    });

    status("WhatsApp call ended.");
  } catch (error) {
    status("Termination error: " + error.message);
  } finally {
    await cleanup();
    busy = false;
    controls();
  }
};

window.addEventListener("pagehide", () => {
  if (peer) peer.close();

  if (localStream) {
    localStream.getTracks().forEach(track => track.stop());
  }
});

controls();
status("Ready. Customer permission must be approved before calling.");
</script>

</body>
</html>
