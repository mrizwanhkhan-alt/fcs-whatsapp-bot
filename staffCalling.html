
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FCS Express | Staff Calling</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:16px;background:#f4f5f7;font-family:Arial,sans-serif}
.panel{max-width:460px;margin:15px auto;padding:22px;background:white;border-radius:12px;box-shadow:0 3px 18px #00000012}
h2{color:#c8102e;margin-bottom:4px}
h3{margin-top:0;color:#333}
label{display:block;margin-top:16px;font-weight:bold}
[hidden]{display:none!important}
#template{width:auto;margin-right:6px}
input,button{width:100%;padding:13px;margin-top:9px;font-size:16px;border-radius:7px}
input{border:1px solid #ccc}
button{background:#c8102e;color:white;border:0;cursor:pointer}
button:disabled{background:#aaa;cursor:not-allowed}
#end{background:#333}
#end:disabled{background:#aaa}
#status{white-space:pre-wrap;line-height:1.5;padding:12px;background:#f5f5f5;border-radius:7px;overflow-wrap:anywhere}
small{color:#666}
</style>
</head>
<body>

<div class="panel">
<h2>FCS EXPRESS</h2>
<h3>WhatsApp Staff Calling</h3>

<label for="customer">Customer WhatsApp Number</label>
<input id="customer" type="tel" inputmode="tel" placeholder="923001234567">

<div id="accessSection" hidden><input id="secret" type="hidden" value="session"></div>

<button id="listen">Connect Calling Panel</button>

<section id="representativeRequests" hidden>
<h2>Representative call requests</h2>
<ul id="representativeRequestList"></ul>
</section>

<div id="incoming" hidden>
<p id="caller"></p>
<button id="answer">Answer</button>
<button id="reject">Decline</button>
</div>

<button id="check" disabled>Check Calling Permission</button>
<button id="permission" disabled>Request Calling Permission</button>

<label id="templateOption" hidden>
<input id="template" type="checkbox">
Use approved template outside the messaging window
</label>

<p id="permissionDelivery" role="status" hidden></p>
<button id="call" disabled>Call Customer</button>
<button id="end" disabled>End Call</button>
<button id="playAudio" hidden>Play Call Audio</button>

<p id="status" role="status">Connecting FCS Calling Panel...</p>
<audio id="remoteAudio" autoplay playsinline></audio>
</div>

<script>
"use strict";

const $ = id => document.getElementById(id);
const customer = $("customer");
const secret = $("secret");
const remoteAudio = $("remoteAudio");

const STORAGE_KEY = "fcs_staff_calling_access_v1";

let session = null;
let peer = null;
let localStream = null;
let active = null;
let incoming = null;
let representativeRequests = [];
let iceServers = [];
let busy = false;
let polling = false;
let callTimeout;
let permissionMessageId;

function showPermissionDelivery(message) {
  const line = $("permissionDelivery");
  if (line.textContent !== message) line.textContent = message;
  line.hidden = !message;
}

function status(message) {
  $("status").textContent = message;
}

function number() {
  const value = customer.value.trim().replace(/^\+/, "");
  if (!/^[1-9]\d{7,14}$/.test(value)) {
    throw new Error("Enter a valid international WhatsApp number.");
  }
  return value;
}

function savedAccess() {
  try {
    return localStorage.getItem(STORAGE_KEY) || "";
  } catch {
    return "";
  }
}

function rememberAccess(token) {
  try {
    localStorage.setItem(STORAGE_KEY, token);
  } catch {
    status("Connected. Browser storage is unavailable, so access may need to be entered again.");
  }
}

function forgetAccess() {
  try {
    localStorage.removeItem(STORAGE_KEY);
  } catch {}
}

async function api(endpoint, payload = {}, keepalive = false) {
  if (!session) throw new Error("Calling panel is not connected.");

  const response = await fetch("/api/staff-calling/" + endpoint, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "X-Requested-With": "FCS-Calling"
    },
    body: JSON.stringify({ ...payload, owner: session.id }),
    cache: "no-store",
    keepalive,
    signal: keepalive ? undefined : AbortSignal.timeout(35000)
  });

  const data = await response.json();

  if (!response.ok) {
    throw Object.assign(
      new Error(data.error || "Calling API request failed."),
      { status: response.status }
    );
  }

  return data;
}

function controls() {
  for (const id of ["check", "permission", "call", "answer", "reject"]) {
    $(id).disabled = !session || busy || Boolean(active);
  }

  $("end").disabled = busy || !active;

  secret.disabled = true;

  $("accessSection").hidden = Boolean(session);

  $("listen").disabled = busy || Boolean(active);

  $("listen").textContent = session
    ? "Disconnect Calling Panel"
    : "Connect Calling Panel";

  $("incoming").hidden = !incoming || Boolean(active);
  $("representativeRequests").hidden = !session || !representativeRequests.length;
  $("representativeRequestList").replaceChildren(...representativeRequests.map(request => {
    const item = document.createElement("li");
    const state = {
      pending: "Sending call button",
      accepted: "Call button accepted by WhatsApp",
      failed: "Call button could not be sent"
    }[request.status];
    item.textContent = "+" + request.number + " · " +
      new Date(request.requestedAt).toLocaleTimeString() + " · " + state;
    return item;
  }));

  $("caller").textContent = incoming
    ? "Incoming call from " + (incoming.number || "WhatsApp customer")
    : "";
}

function closeMedia() {
  clearTimeout(callTimeout);

  const connection = peer;
  peer = null;

  connection?.close();

  localStream?.getTracks().forEach(track => track.stop());
  localStream = null;

  remoteAudio.srcObject = null;
  $("playAudio").hidden = true;
}

function finish(message) {
  closeMedia();
  active = null;
  status(message);
  controls();
}

async function perform(operation) {
  if (busy) return;

  busy = true;
  controls();

  try {
    await operation();
  } catch (error) {
    status(error.message);
  } finally {
    busy = false;
    controls();
  }
}

async function playAudio() {
  try {
    await remoteAudio.play();
    $("playAudio").hidden = true;
  } catch {
    $("playAudio").hidden = !remoteAudio.srcObject;
  }
}

async function createPeer() {
  if (!navigator.mediaDevices?.getUserMedia) {
    throw new Error(
      "Microphone access requires HTTPS and a supported browser."
    );
  }

  status("Allow microphone access to continue.");

  localStream = await navigator.mediaDevices.getUserMedia({
    audio: true,
    video: false
  });

  const connection = new RTCPeerConnection({ iceServers });
  peer = connection;

  const microphone = localStream.getAudioTracks()[0];
  microphone.enabled = false;

  const transceiver = connection.addTransceiver(microphone, {
    direction: "sendrecv",
    streams: [localStream]
  });

  const codecs =
    RTCRtpReceiver.getCapabilities("audio")?.codecs || [];

  const opus = codecs.filter(codec =>
    codec.mimeType.toLowerCase() === "audio/opus" &&
    codec.clockRate === 48000
  );

  const dtmf = codecs.filter(codec =>
    codec.mimeType.toLowerCase() === "audio/telephone-event" &&
    codec.clockRate === 8000
  );

  if (!opus.length || !transceiver.setCodecPreferences) {
    throw new Error(
      "This browser cannot negotiate WhatsApp Opus audio."
    );
  }

  transceiver.setCodecPreferences([...opus, ...dtmf]);

  connection.ontrack = event => {
    if (peer !== connection) return;

    remoteAudio.srcObject =
      event.streams[0] || new MediaStream([event.track]);

    void playAudio();
  };

  connection.onconnectionstatechange = () => {
    if (peer !== connection || !active) return;

    if (connection.connectionState === "connected") {
      if (active.state === "accepted") {
        microphone.enabled = true;
        clearTimeout(callTimeout);
      }

      status(
        active.state === "accepted"
          ? "Call connected."
          : "Audio ready. Waiting for the customer."
      );

    } else if (connection.connectionState === "failed") {
      void endCall("Audio connection failed.");

    } else if (connection.connectionState === "disconnected") {
      status("Audio connection interrupted. Reconnecting...");
      watchConnection(15000);
    }
  };

  return connection;
}

async function localSDP(connection, description) {
  await connection.setLocalDescription(description);

  if (connection.iceGatheringState !== "complete") {
    await new Promise((resolve, reject) => {
      function done(error) {
        clearTimeout(timer);
        connection.removeEventListener(
          "icegatheringstatechange",
          check
        );

        if (error) reject(error);
        else resolve();
      }

      function check() {
        if (connection.iceGatheringState === "complete") {
          done();
        }
      }

      const timer = setTimeout(
        () => done(new Error("WebRTC network candidates were not ready.")),
        12000
      );

      connection.addEventListener(
        "icegatheringstatechange",
        check
      );

      check();
    });
  }

  const sdp = connection.localDescription.sdp;

  if (!/^a=candidate:/m.test(sdp)) {
    throw new Error("No WebRTC network candidates are available.");
  }

  return /^a=ptime:/m.test(sdp)
    ? sdp
    : sdp.replace(/\r\n$/, "\r\na=ptime:20\r\n");
}

function watchConnection(delay) {
  clearTimeout(callTimeout);

  callTimeout = setTimeout(() => {
    void endCall("The call connection timed out.");
  }, delay);
}

async function applyCall(call) {
  if (["ended", "rejected", "failed"].includes(call.state)) {
    finish({
      ended: "WhatsApp call ended.",
      rejected: "WhatsApp call declined.",
      failed: "WhatsApp reported that the call failed."
    }[call.state]);

    return;
  }

  const stateChanged = call.state !== active.state;
  active = call;

  if (call.sdp && peer && !peer.remoteDescription) {
    await peer.setRemoteDescription({
      type: "answer",
      sdp: call.sdp
    });
  }

  if (active !== call) return;

  if (stateChanged) {
    if (call.state === "ringing") {
      status("Customer's WhatsApp is ringing.");
    }

    if (call.state === "accepted") {
      if (peer?.connectionState === "connected") {
        localStream.getAudioTracks()[0].enabled = true;
        clearTimeout(callTimeout);
        status("Call connected.");
      } else {
        watchConnection(30000);
        status("Call accepted. Connecting audio...");
      }
    }
  }
}

async function poll() {
  if (!session || busy || polling) return;

  polling = true;

  const currentSession = session;
  const callId = active?.id;

  try {
    const deliveryId = permissionMessageId;
    const data = await api("poll", { callId, permissionMessageId: deliveryId });

    if (
      session !== currentSession ||
      busy ||
      active?.id !== callId
    ) return;

    incoming = data.incoming[0] || null;
    representativeRequests = data.requests || [];
    if (deliveryId && deliveryId === permissionMessageId) {
      const delivery = data.permissionDelivery;
      if (!delivery) {
        showPermissionDelivery("Delivery status is unavailable. Check with the customer before retrying.");
        permissionMessageId = undefined;
      } else if (delivery.status === "failed") {
        const code = delivery.errorCode ? ` (Meta code ${delivery.errorCode})` : "";
        showPermissionDelivery(`WhatsApp did not deliver the permission request${code}.`);
      } else if (delivery.status === "delivered" || delivery.status === "read") {
        showPermissionDelivery("WhatsApp delivered the permission request. Ask the customer to approve it.");
      } else if (delivery.status === "sent") {
        showPermissionDelivery("WhatsApp sent the request. Customer delivery is still unconfirmed.");
      }
    }

    if (active && data.call) {
      try {
        await applyCall(data.call);
      } catch (error) {
        await endCall(
          "WebRTC audio failed: " + error.message
        );
      }
    }

  } catch (error) {
    if (session === currentSession && !busy) {
      status("Calling panel connection: " + error.message);
    }
  } finally {
    polling = false;
    controls();
  }
}

async function hangUp(message) {
  closeMedia();

  try {
    await api("terminate", { callId: active.id });
    finish(message);

  } catch (error) {
    if (error.status === 404) {
      finish("WhatsApp call is no longer available.");
    } else {
      status(
        "Could not confirm hang-up. Press End Call to retry. " +
        error.message
      );
    }
  }
}

async function endCall(message = "WhatsApp call ended.") {
  if (active) {
    await perform(() => hangUp(message));
  }
}

async function connectPanel(token, automatic = false) {
  if (!token) {
    throw new Error("Sign in to your authorized FCS dashboard.");
  }

  if (!window.isSecureContext || !window.RTCPeerConnection) {
    throw new Error(
      "Open this panel over HTTPS in a WebRTC-enabled browser."
    );
  }

  session = {
    secret: token,
    id: crypto.randomUUID()
  };

  try {
    const data = await api("session");

    iceServers = data.iceServers;
    incoming = data.incoming[0] || null;
    representativeRequests = data.requests || [];

    $("templateOption").hidden = !data.hasTemplate;

    // Access is verified through the signed-in server session, not browser storage.

    secret.value = "session";

    status(
      automatic
        ? "FCS Calling is ready. Enter a customer number and press Call Customer."
        : "Calling panel connected through your dashboard login."
    );

    controls();

  } catch (error) {
    session = null;

    if (automatic && error.status === 401) {
      // Session permissions are managed by Super Admin.
      secret.value = "session";
      status("Calling access is unavailable. Contact Super Admin.");
      return;
    }

    throw error;
  }
}

$("listen").onclick = () => perform(async () => {
  if (session) {
    session = null;
    incoming = null;
    representativeRequests = [];

    forgetAccess();
    secret.value = "";

    $("templateOption").hidden = true;

    status(
      "Calling panel disconnected. Saved access cleared."
    );

    return;
  }

  await connectPanel(secret.value.trim());
});

$("check").onclick = () => perform(async () => {
  const data = await api("permission-status", {
    number: number()
  });

  if (data.canCall) {
    status(
      "Customer calling permission is approved. You can place a call."
    );
  } else {
    status(
      "Calling is unavailable. Meta permission status: " +
      (data.permission || "unknown") + "."
    );
  }
});

$("permission").onclick = () => perform(async () => {
  permissionMessageId = undefined;
  showPermissionDelivery("");
  const data = await api("permission", {
    number: number(),
    useTemplate:
      $("template").checked &&
      !$("templateOption").hidden
  });

  if (data.submitted) {
    permissionMessageId = data.permissionMessageId;
    status("Permission request submitted to Meta.");
    showPermissionDelivery("Meta accepted the request. Waiting for WhatsApp delivery confirmation.");
  } else {
    status(data.canCall
      ? "Customer calling permission is already approved."
      : "Permission is approved. Meta currently limits further calls.");
  }
});

$("call").onclick = () => perform(async () => {
  const destination = number();

  const permission = await api("permission-status", {
    number: destination
  });

  if (!permission.canCall) {
    throw new Error(
      "Meta does not currently allow this call. Check customer permission."
    );
  }

  try {
    const connection = await createPeer();

    const sdp = await localSDP(
      connection,
      await connection.createOffer()
    );

    status("Starting WhatsApp call...");

    const data = await api("connect", {
      number: destination,
      sdp
    });

    active = { id: data.id };

    watchConnection(75000);

    await applyCall(data);

    if (active && data.state === "dialing") {
      status(
        "Call requested. Waiting for WhatsApp."
      );
    }

  } catch (error) {
    if (active) {
      await hangUp(
        "Call setup failed: " + error.message
      );
      return;
    }

    closeMedia();
    throw error;
  }
});

$("answer").onclick = () => perform(async () => {
  const callId = incoming?.id;
  if (!callId) return;

  try {
    const connection = await createPeer();

    const offer = await api("offer", {
      callId
    });

    await connection.setRemoteDescription({
      type: "offer",
      sdp: offer.sdp
    });

    const sdp = await localSDP(
      connection,
      await connection.createAnswer()
    );

    const data = await api("accept", {
      callId,
      sdp
    });

    incoming = null;
    active = { id: data.id };

    await applyCall(data);

  } catch (error) {
    if (active) {
      await hangUp(
        "Call setup failed: " + error.message
      );
      return;
    }

    closeMedia();
    throw error;
  }
});

$("reject").onclick = () => perform(async () => {
  if (!incoming) return;

  await api("reject", {
    callId: incoming.id
  });

  incoming = null;

  status("Incoming call declined.");
});

$("end").onclick = () => {
  void endCall();
};

$("playAudio").onclick = () => {
  void playAudio();
};

window.addEventListener("pagehide", () => {
  if (active) {
    void api(
      "terminate",
      { callId: active.id },
      true
    ).catch(() => {});
  }

  closeMedia();
  active = null;
});

setInterval(() => {
  void poll();
}, 1000);

async function startPanel() {
  const token = "session";

  if (!token) {
    status(
      "Sign in to the FCS Dashboard to access calling."
    );
    controls();
    return;
  }

  await perform(async () => {
    status("Connecting FCS Calling automatically...");
    await connectPanel(token, true);
  });
}

controls();
void startPanel();

</script>
</body>
</html>
